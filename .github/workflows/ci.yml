name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each Ubuntu brings its own kernel and its own kernel headers, so the protocol version agreed in INIT, and
  # which of the header's guards for newer opcodes are compiled, differ between them; 24.04 has protocol 7.39,
  # the oldest ufuse supports. One arm64 job checks the structs' layout on a second architecture.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends meson ninja-build gcc g++
      - name: Kernel and header
        run: |
          uname -r
          grep -E "define FUSE_KERNEL_(VERSION|MINOR_VERSION)" /usr/include/linux/fuse.h
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test unprivileged
        run: meson test -C build --print-errorlogs
      # Mounting a filesystem and creating a character device need root
      - name: Test as root
        run: |
          sudo modprobe cuse
          sudo meson test -C build --print-errorlogs
          grep -h "protocol" build/meson-logs/testlog.txt || true

  # A Meson project taking ufuse installed, through ufuse.pc, and through a wrap
  meson-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends meson ninja-build gcc pkg-config
      - run: tests/meson/check.sh

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
